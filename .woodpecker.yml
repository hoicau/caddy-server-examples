when:
  - event: [tag, release, manual]

matrix:
  include:
    - NAME: linux-amd64
      TARGET_OS: linux
      TARGET_ARCH: amd64
    - NAME: linux-arm64
      TARGET_OS: linux
      TARGET_ARCH: arm64

steps:
  - name: build
    image: golang:1.26
    commands:
      - apt-get update && apt-get install -y curl tar ca-certificates
      - go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest
      - LATEST_TAG=$(curl -s https://api.github.com/repos/caddyserver/caddy/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
      - 'echo "Found Caddy version: $${LATEST_TAG}"'
      - mkdir -p release-tmp release-ready
      - export GOOS=${TARGET_OS}
      - export GOARCH=${TARGET_ARCH}
      - xcaddy build $${LATEST_TAG} --with github.com/WeidiDeng/caddy-cloudflare-ip --with github.com/caddy-dns/cloudflare --output ./release-tmp/caddy
      - cd ./release-tmp
      - sha256sum * > sha256
      - tar -zcvf ../release-ready/caddy-${NAME}.tar.gz *

  - name: release
    image: woodpeckerci/plugin-release
    settings:
      api_key:
        from_secret: codeberg_token
      base_url: https://codeberg.org
      files:
        - release-ready/*
    when:
      - event: [tag, release]
