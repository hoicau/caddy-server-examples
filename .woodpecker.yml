when:
  - event: [tag, manual]

matrix:
  include:
    - NAME: linux-amd64
      TARGET_OS: linux
      TARGET_ARCH: amd64
    - NAME: linux-arm64
      TARGET_OS: linux
      TARGET_ARCH: arm64

steps:
  - name: build
    image: golang:1.26
    commands:
      - export PATH="$(go env GOPATH)/bin:$PATH"
      - go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest
      - mkdir -p release-tmp release-ready
      - CGO_ENABLED=0 GOOS=${TARGET_OS} GOARCH=${TARGET_ARCH} xcaddy build $(printenv CADDY_VERSION || true) --with github.com/WeidiDeng/caddy-cloudflare-ip --with github.com/caddy-dns/cloudflare --output ./release-tmp/caddy
      - cd ./release-tmp
      - sha256sum * > sha256
      - tar -zcvf ../release-ready/caddy-${NAME}.tar.gz *
      - cd ../release-ready
      - sha256sum caddy-${NAME}.tar.gz > sha256sum-${NAME}.txt

  - name: release
    image: woodpeckerci/plugin-release
    settings:
      api_key:
        from_secret: codeberg_token
      base_url: https://codeberg.org
      files:
        - release-ready/*
    when:
      - event: [tag]
