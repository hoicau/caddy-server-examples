name: Build caddy

on:
  workflow_dispatch:
    inputs:
      caddy_version:
        description: 'Caddy version to build (leave empty for latest)'
        required: false
        default: ''

  release:
    types: 
      - 'prereleased'
      - 'released'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
        - {
            name: "linux-amd64",
            GOARCH: amd64,
            GOOS: linux,
            release: true
          }
        - {
            name: "linux-arm64",
            GOARCH: arm64,
            GOOS: linux,
            release: true
          }

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        check-latest: true
    
    - name: Install xcaddy
      run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest
    
    - name: Build caddy
      env:
        CADDY_VERSION: ${{ inputs.caddy_version }}
      run: |
        mkdir -p release-tmp
        CGO_ENABLED=0 GOOS=${{ matrix.config.GOOS }} GOARCH=${{ matrix.config.GOARCH }} \
          ~/go/bin/xcaddy build $(printenv CADDY_VERSION || true) \
          --with github.com/WeidiDeng/caddy-cloudflare-ip \
          --with github.com/caddy-dns/cloudflare \
          --output ./release-tmp/caddy

    - name: Calculate Hash
      run: |
        cd ./release-tmp || exit 1
        sha256sum * > sha256

    - name: Compress to tar
      run: |
        mkdir release-ready
        cd ./release-tmp
        tar -zcvf ../release-ready/caddy-${{ matrix.config.name }}.tar.gz *

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v3
      if: github.event_name == 'release' && matrix.config.release
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        files: ./release-ready/caddy-${{ matrix.config.name }}.tar.gz
        tag_name: ${{ github.ref_name }}
